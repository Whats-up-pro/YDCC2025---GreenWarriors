version: '3.8'

services:
  db:
    image: postgres:alpine
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_NAME:-shrimp_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ../backend
    env_file:
      - ../.env
    volumes:
      - ../backend/ml_models:/app/ml_models
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ../frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n
    env_file:
      - ../.env
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/data/workflows

volumes:
  postgres_data:
  n8n_data:
