name: green_warriors
description: A Flutter application for shrimp disease detection using AI

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # TensorFlow Lite for Flutter
  tflite_flutter: ^0.10.4
  
  # Image processing
  image: ^4.1.3
  
  # Camera access
  camera: ^0.10.5+5
  
  # Path provider for file access
  path_provider: ^2.1.1
  
  # Platform integration
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Assets configuration
  assets:
    - assets/models/
    - assets/models/labels.txt
