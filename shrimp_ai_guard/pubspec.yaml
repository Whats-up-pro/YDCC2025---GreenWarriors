name: shrimp_ai_guard
description: "AI-powered shrimp monitoring application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Camera access for taking photos
  camera: ^0.10.5+5
  
  # TensorFlow Lite for on-device AI
  tflite_flutter: ^0.10.4
  
  # Image processing (resize, crop)
  image: ^4.1.3
  
  # Local database
  sqflite: ^2.3.0
  
  # File system paths
  path_provider: ^2.1.1
  
  # Network connectivity checking
  connectivity_plus: ^5.0.2
  
  # HTTP client for server requests
  dio: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
